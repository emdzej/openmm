<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- OpenMM's mark: the wordmark's roundel (red ring, cyan centre) on yellow speed stripes, with a heavy
       italic MM in white outlined in purple. Drawn for the project; colours sampled from the box. -->
  <g fill="#fbf214" stroke="#2a0a3c" stroke-width="2" stroke-linejoin="round">
    <path d="M1 22 H22 L20 29 H4Z"/>
    <path d="M63 22 H42 L44 29 H60Z"/>
    <path d="M4 33 H21 L19 39 H7Z"/>
    <path d="M60 33 H43 L45 39 H57Z"/>
  </g>
  <circle cx="32" cy="32" r="22" fill="#d22a1b" stroke="#2a0a3c" stroke-width="2.5"/>
  <circle cx="32" cy="32" r="15" fill="#1aa0dc" stroke="#2a0a3c" stroke-width="2"/>
  <path d="M8 25 H56 L50 41 H14Z" fill="#421057" stroke="#2a0a3c" stroke-width="2.5" stroke-linejoin="round"/>
  <text x="33" y="39.5" text-anchor="middle" font-family="Arial Black, Helvetica, Arial, sans-serif" font-weight="900"
        font-style="italic" font-size="17" fill="#ffffff" stroke="#2a0a3c" stroke-width="3" paint-order="stroke">MM</text>
</svg>

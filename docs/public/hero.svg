<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <!-- Drawn for OpenMM, not taken from the game: a toy race track on a checked tablecloth, seen from
       above, with three small cars in the palette's primaries. -->
  <defs>
    <pattern id="cloth" width="50" height="50" patternUnits="userSpaceOnUse">
      <rect width="50" height="50" fill="#ffffff"/>
      <rect width="25" height="25" fill="#cfe9ff"/>
      <rect x="25" y="25" width="25" height="25" fill="#cfe9ff"/>
    </pattern>
    <pattern id="kerb" width="24" height="24" patternUnits="userSpaceOnUse">
      <rect width="24" height="24" fill="#ffffff"/>
      <rect width="12" height="24" fill="#e00000"/>
    </pattern>
    <g id="car">
      <rect x="-11" y="-18" width="22" height="36" rx="7" stroke="#14141c" stroke-width="2.5"/>
      <rect x="-7" y="-11" width="14" height="8" rx="2.5" fill="#00a1ff" stroke="#14141c" stroke-width="1.5"/>
      <rect x="-15" y="-14" width="4" height="8" rx="1.5" fill="#14141c"/>
      <rect x="11" y="-14" width="4" height="8" rx="1.5" fill="#14141c"/>
      <rect x="-15" y="6" width="4" height="8" rx="1.5" fill="#14141c"/>
      <rect x="11" y="6" width="4" height="8" rx="1.5" fill="#14141c"/>
    </g>
  </defs>
  <rect width="400" height="400" rx="28" fill="url(#cloth)"/>
  <path d="M200 52 C330 52 352 130 300 186 C262 228 300 262 300 300 C300 350 250 352 200 352
           C120 352 52 330 52 250 C52 188 118 186 118 140 C118 82 140 52 200 52Z"
        fill="none" stroke="url(#kerb)" stroke-width="74" stroke-linejoin="round"/>
  <path d="M200 52 C330 52 352 130 300 186 C262 228 300 262 300 300 C300 350 250 352 200 352
           C120 352 52 330 52 250 C52 188 118 186 118 140 C118 82 140 52 200 52Z"
        fill="none" stroke="#6b6b73" stroke-width="58" stroke-linejoin="round"/>
  <path d="M200 52 C330 52 352 130 300 186 C262 228 300 262 300 300 C300 350 250 352 200 352
           C120 352 52 330 52 250 C52 188 118 186 118 140 C118 82 140 52 200 52Z"
        fill="none" stroke="#ffffff" stroke-width="2.5" stroke-dasharray="14 12"/>
  <rect x="182" y="23" width="8" height="58" fill="#14141c"/>
  <rect x="182" y="23" width="4" height="7" fill="#ffffff"/><rect x="186" y="30" width="4" height="7" fill="#ffffff"/>
  <rect x="182" y="37" width="4" height="7" fill="#ffffff"/><rect x="186" y="44" width="4" height="7" fill="#ffffff"/>
  <rect x="182" y="51" width="4" height="7" fill="#ffffff"/><rect x="186" y="58" width="4" height="7" fill="#ffffff"/>
  <rect x="182" y="65" width="4" height="7" fill="#ffffff"/><rect x="186" y="72" width="4" height="7" fill="#ffffff"/>
  <use href="#car" fill="#e00000" transform="translate(250 64) rotate(96)"/>
  <use href="#car" fill="#f6f600" transform="translate(316 150) rotate(150)"/>
  <use href="#car" fill="#0000e0" transform="translate(78 236) rotate(-10)"/>
</svg>
